
{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="صفحه‌بندی">

    {% if page_obj.has_previous %}
        <a href="?page={{ page_obj.previous_page_number }}">قبلی</a>
    {% else %}
        <a class="disabled" aria-disabled="true">قبلی</a>
    {% endif %}

    {% for i in page_obj.paginator.page_range %}
        {% if page_obj.number == i %}
            <a class="active" aria-current="page">{{ i }}</a>
        {% else %}
            <a href="?page={{ i }}">{{ i }}</a>
        {% endif %}
    {% endfor %}

    {% if page_obj.has_next %}
        <a href="?page={{ page_obj.next_page_number }}">بعدی</a>
    {% else %}
        <a class="disabled" aria-disabled="true">بعدی</a>
    {% endif %}

</nav>
{% endif %}
